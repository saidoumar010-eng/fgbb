# Déploie le dossier website/ sur GitHub Pages à chaque push.
# Le site est statique : on téléverse simplement website/ comme artefact Pages.
name: Déploiement du site (GitHub Pages)

on:
  push:
    branches: ["master"]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Téléverser le site (dossier website/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
